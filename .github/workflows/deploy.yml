name: Deploy to environment

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      environment:
        description: "Github deployment environment"
        required: false
        default: "dev"
        type: choice
        options:
          - dev

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write
  pull-requests: write

jobs:
  # ==========================================
  # PRE-DEPLOYMENT CODE QUALITY & TEST GATES
  # ==========================================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/secret-detection@453d9818c2281d40fb9e2a7bdd143487978ccbec
        with:
          trufflehog_args: --max-depth=0 --results=verified
      - name: Scan for unverified/possible secrets (non-blocking)
        continue-on-error: true
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/secret-detection@453d9818c2281d40fb9e2a7bdd143487978ccbec
        with:
          trufflehog_args: --max-depth=0 --results=unverified,unknown

  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Prettier check
        run: bun run format:check
      - name: Run ESLint
        run: bun run lint:check

  code-security-audit:
    name: Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run security audit
        run: bun audit || true

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    if: success() && (github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null))

  playwright:
    name: Playwright Tests
    uses: ./.github/workflows/playwright.yml
    if: success() && (github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null))

  zap-scan:
    name: ZAP Security Scanning
    uses: ./.github/workflows/zap-scanning.yml
    if: success() && (github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null))

  # ==========================================
  # BUILD & PUSH IMAGE (Requires All Pre-checks)
  # ==========================================
  build-push-scan:
    name: Build, Push and Scan
    needs:
      [
        secret-scan,
        code-linting,
        code-security-audit,
        unit-tests,
        playwright,
        zap-scan,
      ]
    if: github.actor != 'renovate[bot]'
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-build-push.yml@b75a6f2899db8ae9cc021c9ff988f0f479c4d0e7
    with:
      app_name: laa-civil-manage
      additional_image_tags: ${{ github.ref == 'refs/heads/main' && '["main"]' || '[]' }}
    secrets: inherit

  # ==========================================
  # DEV DEPLOYMENT
  # ==========================================
  prepare_dev:
    name: Prepare Dev Environment
    if: github.actor != 'renovate[bot]' && !failure() && !cancelled()
    needs: build-push-scan
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.vars.outputs.release_name }}
      release_host: ${{ steps.vars.outputs.release_host }}
      identifier: ${{ steps.vars.outputs.identifier }}
    steps:
      - id: vars
        run: |
          APP_NAME="laa-civil-manage"
          ENVIRONMENT="dev"
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"

          if [ "${BRANCH_NAME}" == "main" ]; then
            RELEASE_NAME="${APP_NAME}"
            RELEASE_HOST="${APP_NAME}-${ENVIRONMENT}.cloud-platform.service.justice.gov.uk"
            IDENTIFIER="${APP_NAME}-green-${APP_NAME}-${ENVIRONMENT}-green"
          else            
            CLEAN_BRANCH=$(echo "${BRANCH_NAME}" | sed -E 's|^gh-readonly-queue/[^/]+/||' | sed -E 's|^[^/]+/||')
            RELEASE_NAME=$(echo "${CLEAN_BRANCH}" | tr '[:upper:]' '[:lower:]' | tr -s ' _/[]().' '-' | cut -c1-18 | sed 's/-$//')

            RELEASE_HOST="${RELEASE_NAME}-${APP_NAME}-${ENVIRONMENT}.cloud-platform.service.justice.gov.uk"
            IDENTIFIER="${RELEASE_NAME}-green-${APP_NAME}-${ENVIRONMENT}-green"
          fi

          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_host=${RELEASE_HOST}" >> "$GITHUB_OUTPUT"
          echo "identifier=${IDENTIFIER}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to Dev
    needs: [prepare_dev, build-push-scan]
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: dev
      image_registry: ${{ needs.build-push-scan.outputs.image_registry }}
      image_repo: ${{ needs.build-push-scan.outputs.image_repo }}
      image_tag: ${{ needs.build-push-scan.outputs.image_tag }}
      helm_release_name: ${{ needs.prepare_dev.outputs.release_name }}
      helm_additional_args: >-
        --set certificate.enabled=false
        --set nameOverride="${{ needs.prepare_dev.outputs.release_name }}"
        --set-string ingress.green.hostname="${{ needs.prepare_dev.outputs.release_host }}"
        --set-string ingress.green.annotations."external-dns\.alpha\.kubernetes\.io/set-identifier"="${{ needs.prepare_dev.outputs.identifier }}"
        --set-string containerEnvironment.variables.AUTH_REDIRECT_URL="https://${{ needs.prepare_dev.outputs.release_host }}/auth/redirect"
        --set-string containerEnvironment.variables.AUTH_LOGOUT_REDIRECT_URL="https://${{ needs.prepare_dev.outputs.release_host }}/auth/login"
    secrets: inherit

  notify_pr_dev:
    name: Post PR Notification
    if: github.event_name == 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    needs: [prepare_dev, deploy-dev]
    permissions:
      pull-requests: write
    steps:
      - name: Post deployment URL to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = "https://${{ needs.prepare_dev.outputs.release_host }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Branch deployed to dev: [${url}](${url})`,
            });

  cleanup_merge_group:
    name: Cleanup Merge Queue
    if: github.event_name == 'merge_group' && !cancelled()
    environment: dev
    runs-on: ubuntu-latest
    needs: [prepare_dev, deploy-dev]
    steps:
      - name: Authenticate to cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@8e0e6bbaa7d9075660c044b2e2c934a966c56570
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Uninstall Merge Queue Release
        run: |
          RELEASE_NAME="${{ needs.prepare_dev.outputs.release_name }}"
          echo "Cleaning up merge queue release: ${RELEASE_NAME}"
          helm uninstall "${RELEASE_NAME}" -n laa-civil-manage-dev --wait || true

  # ==========================================
  # STAGING DEPLOYMENT
  # ==========================================
  prepare_staging:
    name: Prepare Staging Environment
    if: github.actor != 'renovate[bot]' && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy-dev
    outputs:
      release_name: ${{ steps.vars.outputs.release_name }}
      release_host: ${{ steps.vars.outputs.release_host }}
      identifier: ${{ steps.vars.outputs.identifier }}
    steps:
      - id: vars
        run: |
          APP_NAME="laa-civil-manage"
          ENVIRONMENT="staging"
          RELEASE_NAME="${APP_NAME}"
          RELEASE_HOST="${APP_NAME}-${ENVIRONMENT}.cloud-platform.service.justice.gov.uk"
          IDENTIFIER="${APP_NAME}-green-${APP_NAME}-${ENVIRONMENT}-green"

          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_host=${RELEASE_HOST}" >> "$GITHUB_OUTPUT"
          echo "identifier=${IDENTIFIER}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging
    needs: [prepare_staging, build-push-scan]
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: staging
      image_registry: ${{ needs.build-push-scan.outputs.image_registry }}
      image_repo: ${{ needs.build-push-scan.outputs.image_repo }}
      image_tag: ${{ needs.build-push-scan.outputs.image_tag }}
      helm_release_name: ${{ needs.prepare_staging.outputs.release_name }}
      helm_additional_args: >-
        --set certificate.enabled=false
        --set nameOverride="${{ needs.prepare_staging.outputs.release_name }}"
        --set-string ingress.green.hostname="${{ needs.prepare_staging.outputs.release_host }}"
        --set-string ingress.green.annotations."external-dns\.alpha\.kubernetes\.io/set-identifier"="${{ needs.prepare_staging.outputs.identifier }}"
        --set-string containerEnvironment.variables.AUTH_REDIRECT_URL="https://${{ needs.prepare_staging.outputs.release_host }}/auth/redirect"
        --set-string containerEnvironment.variables.AUTH_LOGOUT_REDIRECT_URL="https://${{ needs.prepare_staging.outputs.release_host }}/auth/login"
    secrets: inherit
