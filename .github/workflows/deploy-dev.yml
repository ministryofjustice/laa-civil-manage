name: Deploy to DEV and staging

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      environment:
        description: "Github deployment environment"
        required: false
        default: "dev"
        type: choice
        options:
          - dev

permissions:
  contents: read

jobs:
  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prettier check
        run: bun run format:check

      - name: Run ESLint
        run: bun run lint:check

  code-security-audit:
    name: Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit || true

  build-push-scan:
    name: Build, Push and Scan
    if: github.actor != 'renovate[bot]'
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-build-push.yml@b75a6f2899db8ae9cc021c9ff988f0f479c4d0e7
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write
    with:
      app_name: laa-civil-manage
      additional_image_tags: ${{ github.ref == 'refs/heads/main' && '["main"]' || '[]' }}
    secrets: inherit

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    # Only run tests when deploying to dev
    if: success() && (github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null))

  playwright:
    name: Playwright Tests
    uses: ./.github/workflows/playwright.yml
    if: success() && (github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null))

  zap-scan:
    name: ZAP Security Scanning
    uses: ./.github/workflows/zap-scanning.yml
    needs:
      - build-push-scan
    # Only run tests when deploying to dev
    if: success() && (github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == null))

  deploy-dev:
    if: github.actor != 'renovate[bot]' && !failure() && !cancelled()
    environment: dev
    runs-on: ubuntu-latest
    needs:
      - code-linting
      - code-security-audit
      - build-push-scan
      - zap-scan
      - unit-tests
      - playwright
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Deploy to dev
        id: deploy_dev
        uses: ./.github/actions/deploy
        with:
          app-environment: dev
          auth_client_id: ${{ secrets.AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.AUTH_CLIENT_SECRET }}
          auth_directory_url: ${{ secrets.AUTH_DIRECTORY_URL }}
          auth_redirect_url: ${{ secrets.AUTH_REDIRECT_URL }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_name: ${{ vars.SERVICE_NAME }}
          session_name: ${{ vars.SESSION_NAME }}
          session_secret: ${{ secrets.SESSION_SECRET }}
          service_phase: ${{ vars.SERVICE_PHASE }}
          backend_url: ${{ vars.BACKEND_URL }}
          skip_auth: ${{vars.SKIP_AUTH}}
          department_name: ${{ vars.DEPARTMENT_NAME }}

      - name: Post deployment URL to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `${{ steps.deploy_dev.outputs.release_url }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Branch deployed to dev: [${url}](${url})`,
            });

  deploy-staging:
    if: github.actor != 'renovate[bot]' && !failure() && !cancelled() &&
      github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    needs:
      - deploy-dev
      - code-linting
      - code-security-audit
      - build-push-scan
      - zap-scan
      - unit-tests
      - playwright

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Deploy to staging
        uses: ./.github/actions/deploy
        with:
          app-environment: staging
          auth_client_id: ${{ secrets.AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.AUTH_CLIENT_SECRET }}
          auth_directory_url: ${{ secrets.AUTH_DIRECTORY_URL }}
          auth_redirect_url: ${{ secrets.AUTH_REDIRECT_URL }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_name: ${{ vars.SERVICE_NAME }}
          session_name: ${{ vars.SESSION_NAME }}
          session_secret: ${{ secrets.SESSION_SECRET }}
          service_phase: ${{ vars.SERVICE_PHASE }}
          backend_url: ${{ vars.BACKEND_URL }}
          skip_auth: ${{vars.SKIP_AUTH}}
          department_name: ${{ vars.DEPARTMENT_NAME }}
