name: Software Composition Analysis
run-name: Security Scanning ⚡️

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Renovate
        uses: renovatebot/github-action@7b4b65bf31e07d4e3e51708d07700fb41bc03166 # v46.1.3
        env:
          RENOVATE_MINIMUM_RELEASE_AGE: 3
          RENOVATE_MINIMUM_RELEASE_AGE_BEHAVIOUR: timestamp-required
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-version: "43.24.2"
