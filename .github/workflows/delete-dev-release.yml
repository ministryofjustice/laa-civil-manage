name: Delete DEV release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  delete_dev_job:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      branch-name: ${{ steps.extract_branch.outputs.branch }}
      release-name: ${{ steps.extract_release.outputs.release }}
      delete-message: ${{ steps.delete_release.outputs.message }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract branch name
        id: extract_branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || 'not_given' }}
        run: |
          if [ "$BRANCH_NAME" == "not_given" ]; then
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
          else
            branch="$BRANCH_NAME"
          fi
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Extract release name
        id: extract_release
        shell: bash
        run: |
          branch=${{ steps.extract_branch.outputs.branch }}
          truncated_branch=$(echo $branch | tr '[:upper:]' '[:lower:]' | sed 's:^\w*\/::' | tr -s ' _/[]().' '-' | cut -c1-18 | sed 's/-$//')
          echo "release=$truncated_branch" >> $GITHUB_OUTPUT

      - name: Authenticate to the cluster
        id: authenticate_to_cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@8e0e6bbaa7d9075660c044b2e2c934a966c56570
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Delete DEV release
        id: delete_release
        shell: bash
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          release_name=${{ steps.extract_release.outputs.release }}

          echo "Looking for release '$release_name' in namespace '$NAMESPACE'..."

          # Check if the release exists in the target namespace
          if helm status "$release_name" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "Release found! Uninstalling..."
            helm uninstall "$release_name" -n "$NAMESPACE" --wait
            echo "message=\"Deleted DEV release ${release_name}\"" >> $GITHUB_OUTPUT
          else
            echo "message=\"DEV release, ${release_name}, not found\"" >> $GITHUB_OUTPUT
          fi

      - name: Output result
        shell: bash
        run: echo "${{ steps.delete_release.outputs.message }}"
