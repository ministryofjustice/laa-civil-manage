name: Playwright Tests
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Mark this job as required for PR checks
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Fetch all history for proper change detection

      - name: Set up Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/yarn.lock') }}

      - name: Run Playwright tests
        run: bun run test:playwright
        env:
          CI: true
          AUTH_DIRECTORY_URL: "http://test"
          AUTH_CLIENT_ID: "test_id"
          AUTH_CLIENT_SECRET: "test_secret"
          AUTH_REDIRECT_URL: "http://test"
          SESSION_SECRET: "playwright-test-secret"
          SESSION_NAME: "sessionId"
          SKIP_AUTH: "true"
          SERVICE_NAME: "Civil Manage"
          RATE_LIMIT_MAX: "10000"
          RATE_WINDOW_MS: "900000"

      - name: Notify on test failure
        if: failure()
        run: echo "::error::Playwright tests failed! Check the test report for details."
