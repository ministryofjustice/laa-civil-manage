name: Playwright Tests
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Mark this job as required for PR checks
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Fetch all history for proper change detection

      - name: Set up Mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/yarn.lock') }}

      - name: Run Playwright tests
        run: bun run test:playwright
        env:
          CI: true
          AUTH_DIRECTORY_URL: "http://test"
          AUTH_CLIENT_ID: "test_id"
          AUTH_CLIENT_SECRET: "test_secret"
          AUTH_REDIRECT_URL: "http://test"
          SESSION_SECRET: "playwright-test-secret"
          SESSION_NAME: "sessionId"
          SKIP_AUTH: "true"
          SERVICE_NAME: "Civil Manage"
          RATE_LIMIT_MAX: "10000"
          RATE_WINDOW_MS: "900000"

      - name: Notify on test failure
        if: failure()
        run: echo "::error::Playwright tests failed! Check the test report for details."
