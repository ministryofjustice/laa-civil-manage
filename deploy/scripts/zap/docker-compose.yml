services:
  civil-manage:
    build:
      context: ../../../.
      args:
        NODE_ENV: test
    ports:
      - "3000:3000"
    depends_on:
      - wiremock
    environment:
      SESSION_SECRET: zap-test-secret
      SESSION_NAME: sessionId
      DEPARTMENT_NAME: ZAP_DEPARMENT
      DEPARTMENT_URL: http://fake-zap-url.fake
      AUTH_CLIENT_ID: zap-mock-client
      AUTH_CLIENT_SECRET: zap-mock-secret
      AUTH_DIRECTORY_URL: https://wiremock:8443/mock-entra/zap-tenant
      AUTH_REDIRECT_URL: http://civil-manage:3000/auth/redirect
      AUTH_LOGOUT_REDIRECT_URL: http://civil-manage:3000/auth/login
      KNOWN_AUTHORITIES: wiremock:8443
      MANAGE_API_SCOPE: zap-api-scope
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      BACKEND_URL: http://wiremock:8080
      SERVICE_NAME: Zap service
      SERVICE_PHASE: Zap Phase
  zap-scan:
    image: zaproxy/zap-stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
    command: zap.sh -cmd -port 9090 -autorun /zap/wrk/zap.yaml
    volumes:
      - ../../../.:/zap/wrk:rw
    links:
      - civil-manage
  wiremock:
    image: wiremock/wiremock:latest@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: --verbose --https-port 8443 --global-response-templating
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ../../../tests/resources/wiremock:/home/wiremock/mappings:ro
